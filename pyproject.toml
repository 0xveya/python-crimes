[project]
name = "python-crimes"
version = "0.0.1"
description = "Composable pipes, deferred cleanup, and typed-errs-aware pattern matching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Veya Fürst", email = "ghgstefan@gmail.com" }]
keywords = ["crimes", "defer", "match", "awful-python", "pipes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["typed-errs>=0,<1"]

[project.urls]
PyPI = "https://pypi.org/project/python-crimes/"
Repository = "https://github.com/0xveya/python-crimes"
Issues = "https://github.com/0xveya/python-crimes/issues"

[dependency-groups]
dev = ["basedpyright", "mypy", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["python_crimes"]

[tool.setuptools.package-data]
python_crimes = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
